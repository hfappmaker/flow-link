name: flow-link-devcontainer

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    init: true
    security_opt:
      - seccomp=unconfined
    volumes:
      - ..:/workspaces/flow-link:cached
      - flow-link-node-modules:/workspaces/flow-link/node_modules
      - flow-link-next-cache:/workspaces/flow-link/.next
      - flow-link-node-home:/home/node
      - flow-link-codex-home:/home/node/.codex
      - flow-link-claude-home:/home/node/.claude
      - flow-link-npm-cache:/home/node/.npm
      - flow-link-ssh-host-keys:/etc/ssh/flow-link-host-keys
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:5555:5555"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://flowlink:flowlink@db:5432/flow_link?schema=public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowlink
      POSTGRES_PASSWORD: flowlink
      POSTGRES_DB: flow_link
    volumes:
      - flow-link-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowlink -d flow_link"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flow-link-node-modules:
  flow-link-next-cache:
  flow-link-node-home:
  flow-link-codex-home:
  flow-link-claude-home:
  flow-link-npm-cache:
  flow-link-ssh-host-keys:
  flow-link-postgres-data:
