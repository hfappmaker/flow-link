name: Codex issue triage

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Triage mode"
        required: true
        type: choice
        options:
          - bug
          - product
          - ux
          - visual-design
          - maintainability
  schedule:
    - cron: "5 * * * *"
    - cron: "15 * * * *"
    - cron: "25 * * * *"
    - cron: "35 * * * *"
    - cron: "45 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-issue-triage-${{ github.event.inputs.mode || github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowlink
          POSTGRES_PASSWORD: flowlink
          POSTGRES_DB: flow_link
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowlink -d flow_link"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AUTH_SECRET: codex-triage-actions-secret
      AUTH_TRUST_HOST: "true"
      BLOB_READ_WRITE_TOKEN: codex-triage-placeholder-token
      BRANCH: develop
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
      DATABASE_URL: postgresql://flowlink:flowlink@localhost:5432/flow_link?schema=public
      ENV_FILE: /dev/null
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.CODEX_API_KEY }}
      REPO_DIR: ${{ github.workspace }}
      SKIP_BRANCH_CHECK: "1"
      TRIAGE_SKIP_GIT_SYNC: "1"
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Resolve triage mode
        id: mode
        shell: bash
        run: |
          mode="${{ github.event.inputs.mode || '' }}"
          if [[ -z "$mode" ]]; then
            case "${{ github.event.schedule }}" in
              "5 * * * *") mode="bug" ;;
              "15 * * * *") mode="product" ;;
              "25 * * * *") mode="ux" ;;
              "35 * * * *") mode="visual-design" ;;
              "45 * * * *") mode="maintainability" ;;
              *) echo "Unknown schedule: ${{ github.event.schedule }}" >&2; exit 1 ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: develop
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Prepare database
        run: |
          npx prisma migrate deploy
          npm run seed:codex-triage

      - name: Run Codex issue triage
        run: bash scripts/codex-auto-issue-triage.sh --mode "${{ steps.mode.outputs.mode }}"

      - name: Upload Codex automation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-triage-logs-${{ steps.mode.outputs.mode }}
          path: .codex-automation/
          if-no-files-found: ignore

      - name: Upload visual-design screenshots
        if: always() && steps.mode.outputs.mode == 'visual-design'
        uses: actions/upload-artifact@v4
        with:
          name: codex-screenshots-${{ github.run_id }}
          path: .codex-automation/screenshots/
          if-no-files-found: warn
